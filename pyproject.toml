[project]
name = "sampleflux"
version = "0.1.0"
description = "Clean, functional data pipelines for ML research and production."
authors = [{ name = "Taidal", email = "info@gearlux.ai" }]
dependencies = [
    "confluid>=0.1.0",
    "loggair>=0.1.0",
    "numpy",
    "Pillow",
    "h5py",
    "zarr",
    "torch",
    "typing-extensions",
    "datasets",
    "albumentations",
    "orjson",
    "fsspec",
    "cloudpathlib",
    "scikit-learn",  # LabelMap.fit() uses sklearn.preprocessing.LabelEncoder (lazy-imported)
    # liquifai powers the generic `sampleflux run <config.yaml>` CLI (sampleflux.cli) that
    # runs any Confluid-wired runnable; it also brings `rich` (used by DatasetProcessor's
    # optional console progress bar). liquifai depends only on confluid/loggair/rich — no cycle.
    "liquifai>=0.1.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "flake8-junit-report>=2.1.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
    # CI installs `.[dev]` (unit-tests AND verify-examples), so torchvision here keeps the
    # bare torchvision-v2 op family + examples exercised in CI without a workflow edit.
    "torchvision",
]
notebook = [
    "matplotlib",
    "datasets",
    "python-dotenv",
]
vision = [
    "scipy",
    # Bare torchvision transforms.v2 ops run as-is through the engine's op-family dispatch
    # (sampleflux.core._apply_op); the extra makes `pip install sampleflux[vision]` the
    # documented way to enable them.
    "torchvision",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

# CONFLUID-CONFIGURABLE DISCOVERY
# Sources / ops live in separate submodules that `sampleflux/__init__.py`
# does not eagerly import. Listing them here makes navigaitor discover
# every ``@configurable`` on bootstrap without hardcoding the list.
[project.entry-points."confluid.configurables"]
sampleflux = "sampleflux"
sampleflux-core = "sampleflux.core"
sampleflux-sources = "sampleflux.sources"
sampleflux-ops-parallel = "sampleflux.ops.parallel"
sampleflux-ops-enable = "sampleflux.ops.enable"
sampleflux-ops-random-apply = "sampleflux.ops.random_apply"
# ConfigureOp (per-sample parameter injection — the helios Configure pattern); entry-point
# changes need an editable reinstall before FluxStudio/navigaitor discovery sees the module.
sampleflux-ops-configure = "sampleflux.ops.configure"
sampleflux-ops-formula = "sampleflux.ops.formula"
# Context ops (Save/Use/Drop/Apply/Capture/MergeFields) — the graph-plane building blocks lowered from flow: docs
sampleflux-ops-context = "sampleflux.ops.context"
# The FlowGraph engine (flow: named-step documents + the flow<->ops converters)
sampleflux-flow = "sampleflux.flow"
# The queryable-metadata scan protocol + MetadataFilterSource view source
sampleflux-storage-query = "sampleflux.storage.query"
sampleflux-ops-sink = "sampleflux.ops.sink"
sampleflux-ops-numpy = "sampleflux.ops.numpy"
sampleflux-ops-torch = "sampleflux.ops.torch"
sampleflux-ops-target = "sampleflux.ops.target"
sampleflux-ops-image = "sampleflux.ops.image"
# PrintSampleOp (log/print a per-sample summary). Entry-point changes need an editable reinstall
# before FluxStudio/navigaitor discovery sees the module (`aisland setup`, never --reinstall).
sampleflux-ops-debug = "sampleflux.ops.debug"
# Storage SINKS (HDF5Sink / ZarrGroupSink / ZarrBatchSink / DirectorySink) carry
# category="sink" so FluxStudio surfaces them as DatasetProcessor sink nodes. They live under
# sampleflux.storage.* (NOT re-exported from the package root), and scan_module does not recurse
# submodules, so each storage module needs its own entry point. The matching SOURCES in these
# modules stay uncategorised, so the positive {op,source,engine,sink} allowlist surfaces only the
# tagged sinks. (Entry-point changes need an editable reinstall — `aisland setup`, never --reinstall.)
sampleflux-storage-hdf5 = "sampleflux.storage.hdf5"
sampleflux-storage-zarr = "sampleflux.storage.zarr"
sampleflux-storage-directory = "sampleflux.storage.directory"
# The record model's op surface: Transform (type-dispatched record ops) + Pipeline (THE
# compose op) live in sampleflux.transform. Entry-point changes need an editable reinstall
# before FluxStudio/navigaitor discovery sees the module (`aisland setup`, never --reinstall).
sampleflux-transform = "sampleflux.transform"
# Structure ops (RenameField/DropField/CopyField/SelectFields) — reshape a record's entries.
sampleflux-ops-structure = "sampleflux.ops.structure"
# The runnable orchestration layer: DatasetProcessor (generic source→sink runner) and the
# workflow combinators (Sequence/Conditional/Switch + PathExists/Not/AllOf/AnyOf predicates).
# Discovered as @configurable runnables; run via `sampleflux run`.
sampleflux-processing = "sampleflux.processing"
sampleflux-workflow = "sampleflux.workflow"

# The `sampleflux` console script — `sampleflux run <config.yaml>` runs any Confluid-wired
# runnable (a trainer, an evaluator, a DatasetProcessor, a workflow).
[project.scripts]
sampleflux = "sampleflux.cli:main"

# Liquifai app registration: lets `liquifai-install-completions` discover this CLI via an
# instant entry-point metadata read instead of a subprocess probe. Name = the binary name;
# value = the LiquifyApp instance.
[project.entry-points."liquifai.apps"]
sampleflux = "sampleflux.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sampleflux*"]

[tool.setuptools.package-data]
sampleflux = ["py.typed"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[[tool.mypy.overrides]]
module = [
    "albumentations.*",
    "datasets.*",
    "h5py.*",
    "PIL.*",
    "torchvision.*",
    "zarr.*",
]
ignore_missing_imports = true
